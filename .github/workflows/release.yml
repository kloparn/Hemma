# Publishes a release when main gets a version that hasn't been released (issues #19, #52): every PR
# raises the version in the VERSION file, so merging one releases it - this workflow makes the tag
# (vX.Y.Z, on the merged commit) itself. The notes are that version's CHANGELOG.md section (which
# must exist) and the commits since the last release. Windows runs the suite and builds the programs
# the way build.ps1 does on a PC - with the in-browser converter (av.wasm) - and Linux packs the
# downloads (tools/ci/bundle.sh): a Pi or Linux one holds the program, the installer and the service
# file - and the ready-made Raspberry Pi image (issue #71: tools/image/build.sh, the official
# Raspberry Pi OS Lite with Hemma's download and a first-start unit added). Each SHA256SUMS is signed
# with the project's key (issue #73: the GitHub secret HEMMA_SIGNING_KEY, whose public half is built
# into Hemma; installed Hemmas take nothing unsigned, so a release without the secret fails here).
# No Windows program yet (owner, 2026-10-19): Windows Defender's machine learning calls hemma.exe a
# trojan (a false positive) - it comes back once it's signed or cleared with Microsoft. "Run
# workflow" (by hand, any branch) builds the same downloads without publishing them: a dry run, kept
# as an artifact of the run.
name: release

on:
  push:
    branches: [main]
    paths: ['VERSION', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release # (one at a time: a second merge waits, then finds its version released or not)
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: A version without a release yet?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(tr -d ' \r\n' < VERSION)
          echo "$ver" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || { echo "VERSION must hold MAJOR.MINOR.PATCH: $ver"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$ver: a dry run"
          elif gh release view "v$ver" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$ver" > /dev/null; then
            echo "publish=skip" >> "$GITHUB_OUTPUT"; echo "$ver is out already: nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "$ver: releasing it"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish != 'skip'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2 # (still Node 20 in its newest, 2.2.1: GitHub runs it on Node 24 - update when it does)
        with:
          version: 0.17.0
      # The Android app (2.0; apps/android, docs/decisions/0011): built with the runner's Android SDK, signed with
      # the project's app key (HEMMA_APP_KEYSTORE = the PKCS12 file in base64, HEMMA_APP_KEY_PASSWORD) and built
      # into every program (Your account -> Get the app for Android) - and a download of its own. Android installs
      # an update only over an app signed with the same key: a release without it fails here.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, then build the programs (no Windows one yet) - with the Android app
        shell: powershell
        env:
          APP_KEY_B64: ${{ secrets.HEMMA_APP_KEYSTORE }}
          HEMMA_APP_KEY_PASSWORD: ${{ secrets.HEMMA_APP_KEY_PASSWORD }}
          PUBLISH: ${{ needs.check.outputs.publish }}
        run: |
          if ($env:APP_KEY_B64) {
            $ks = Join-Path $env:RUNNER_TEMP "hemma-app.p12"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:APP_KEY_B64))
            $env:HEMMA_APP_KEYSTORE = $ks
          } elseif ($env:PUBLISH -eq 'true') {
            Write-Host "::error::The secret HEMMA_APP_KEYSTORE is missing: the Android app must be signed with the project's own key"
            exit 1
          } else {
            Write-Host "::warning::No HEMMA_APP_KEYSTORE: a dry run without the Android app"
          }
          foreach ($t in 'test', 'pi', 'pi32', 'linux', 'mac') {
            ./build.ps1 $t
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($env:APP_KEY_B64 -and -not (Test-Path build/hemma.apk)) { Write-Host "::error::The Android app wasn't built"; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: programs
          if-no-files-found: error
          path: |
            build/hemma-pi64
            build/hemma-pi32
            build/hemma-linux
            build/hemma-mac-arm64
            build/hemma-mac-x64
            build/hemma.apk

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # (every commit and tag: the notes list the commits since the last release)
      - uses: actions/download-artifact@v8
        with:
          name: programs
          path: programs
      - name: Downloads, the Pi image, checksums, signatures and notes
        env:
          HEMMA_SIGNING_KEY: ${{ secrets.HEMMA_SIGNING_KEY }}
          PUBLISH: ${{ needs.check.outputs.publish }}
          HEMMA_IMAGE: "1" # (issue #71: Raspberry Pi OS Lite + Hemma; tools/image/build.sh, no root needed)
        run: |
          chmod +x programs/hemma-linux # (artifacts lose the executable bit; this runner is x86-64 Linux)
          if [ -n "$HEMMA_SIGNING_KEY" ]; then
            export HEMMA_SIGNER="$PWD/programs/hemma-linux"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::The secret HEMMA_SIGNING_KEY is missing: every installed Hemma would refuse an unsigned release"
            exit 1
          else
            echo "::warning::No HEMMA_SIGNING_KEY: a dry run without signatures"
          fi
          sh tools/ci/bundle.sh programs dist notes.md
      - name: Publish the release (and its tag)
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.check.outputs.version }}
        run: gh release create "v$VER" dist/* --target "$GITHUB_SHA" --title "Hemma $VER" --notes-file notes.md
      # Only the newest release keeps its Pi image (owner, 2026-10-20): an older one is an older Raspberry
      # Pi OS and an older Hemma - nobody should start a new Pi from it. Its program downloads stay (and
      # their SHA256SUMS still verify: hemma-upgrade checks only the files it takes). Runs only after the
      # new release is out, so a failed release never takes an image away.
      - name: Remove the Pi image from older releases
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.check.outputs.version }}
        run: |
          gh release view "v$VER" --json assets --jq '.assets[].name' | grep -q '\.img\.xz$' || {
            echo "v$VER has no image: the older ones stay"; exit 0; }
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "v$VER" ] && continue
            # (pipefail: a release without an image is no error)
            gh release view "$tag" --json assets --jq '.assets[].name' | { grep '\.img\.xz$' || true; } | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes && echo "removed $asset from $tag"
            done
          done
      - name: Keep the downloads (a dry run)
        if: needs.check.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: downloads
          path: |
            dist/
            notes.md
