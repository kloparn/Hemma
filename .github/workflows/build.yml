# Builds Hemma and runs the whole test suite on Linux and macOS with the system C compiler
# (the Makefile route), on every push and pull request. The Windows build and the
# cross-compiled Raspberry Pi binaries are made with build.ps1 and zig.
# More jobs on Linux: the suite again under AddressSanitizer + UBSan, a short libFuzzer run over
# the video converter (modules/av - tools/ci/fuzz.sh; fuzz.yml goes on for hours every night),
# and the browser's side (tests/browser, Node - CI only, nothing ships): Hemma's pages in Google
# Chrome (the player, Live TV, uploads, the sign-in languages) and eslint over web/*.js.
name: build

on:
  push:
  pull_request:

# The jobs only read the code: keep the workflow's token read-only whatever the
# repository's default is.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: Test
        run: make test

  # Its own job: the test job's build/test is built with default flags and make wouldn't
  # rebuild it. CFLAGS replaces only the Makefile's -O2 (-std=gnu11 and the warnings stay);
  # SQLite keeps its own flags, uninstrumented, which both sanitizers allow. Any report stops
  # the run (-fno-sanitize-recover, halt_on_error). Leak checking stays off for now: the
  # suite was only ever checked where it doesn't exist (macOS) - worth a try later.
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      # ASan's shadow memory and newer kernels' address randomisation can clash (spurious
      # "DEADLYSIGNAL" crashes on some runner images): the usual workaround, harmless otherwise.
      - name: Address-space randomisation ASan copes with
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Test under ASan + UBSan
        run: >
          make -j"$(getconf _NPROCESSORS_ONLN)" test CC=clang
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          LDFLAGS="-fsanitize=address,undefined"

  # libFuzzer over av_convert (MKV in memory -> MP4 in memory) under ASan + UBSan, seeded with
  # the converter tests' synthetic files (MPEG-2 progressive/interlaced/telecined/changing size,
  # H.264, HEVC, AAC plain and laced, AC-3, E-AC-3). What it finds is kept as an artifact:
  # reproduce with `build/fuzz-conv <file>`, or on Windows with the replay build in tools/convfuzz.c.
  fuzz:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Address-space randomisation ASan copes with
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build the suite (it writes the seed files)
        run: make -j"$(getconf _NPROCESSORS_ONLN)" build/test
      - name: libFuzzer's runtime
        run: |
          # libFuzzer comes with clang's runtime libraries; some images keep those in a package of their own
          echo 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long n) { return 0; }' > build/probe.c
          clang -fsanitize=fuzzer build/probe.c -o build/probe || {
            sudo apt-get update -q && sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"; }
      - name: Fuzz the converter (90 s)
        run: sh tools/ci/fuzz.sh conv 90
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: convfuzz-findings
          path: build/fuzz-found-conv/

  # Hemma's pages in a real browser (tests/browser/*.spec.mjs, issue #49): a Hemma of its own on
  # 127.0.0.1 with tiny videos its own encoders make. Google Chrome (the runner has it): the
  # Chromium Playwright brings can't play H.264 or AAC.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: mlugg/setup-zig@v2 # (the Makefile builds av.wasm with it: uploads convert in the browser)
        with:
          version: 0.17.0
      - name: Build Hemma and the suite (the suite makes the test videos)
        run: make -j"$(getconf _NPROCESSORS_ONLN)" all build/test
      - name: Node tools
        working-directory: tests/browser
        run: |
          npm ci
          [ -x /opt/google/chrome/chrome ] || npx playwright install --with-deps chrome
      - name: The pages in Chrome
        working-directory: tests/browser
        run: npx playwright test
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: eslint over web/*.js
        working-directory: tests/browser
        run: |
          npm ci
          npm run lint

  # The Android app (2.0; apps/android): it builds, and its address rules hold (test/NetTest.java) - signed with a
  # key made up for this run (a check only: CI builds of Hemma leave the app out without the release key)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the app (the runner has the Android SDK)
        run: make app
